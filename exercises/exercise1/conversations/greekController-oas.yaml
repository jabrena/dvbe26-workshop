{
  "openapi": "3.0.3",
  "info": {
    "title": "Greek Gods REST API",
    "description": "API for retrieving information about Greek gods",
    "version": "1.0.0",
    "contact": {
      "name": "Greek Gods Service",
      "email": "info@greekgods.example.com"
    },
    "license": {
      "name": "MIT",
      "url": "https://opensource.org/licenses/MIT"
    }
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "Local development server"
    }
  ],
  "paths": {
    "/gods/stats/sum": {
      "get": {
        "tags": [
          "Gods Stats"
        ],
        "summary": "Get sum of gods stats",
        "description": "Returns the sum computed over the gods from the requested sources, using the given filter",
        "operationId": "getGodsSum",
        "parameters": [
          {
            "name": "filter",
            "in": "query",
            "required": true,
            "description": "Filter applied to the gods before computing the sum",
            "schema": {
              "type": "string"
            },
            "example": "N"
          },
          {
            "name": "sources",
            "in": "query",
            "required": false,
            "description": "Comma-separated list of sources to include",
            "schema": {
              "type": "string"
            },
            "example": "greek,roman,nordic"
          }
        ],
        "responses": {
          "200": {
            "description": "Successful operation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SumResponse"
                },
                "example": {
                  "sum": "78179288397447443426"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request: filter is missing, empty or not exactly one Unicode code point, or sources contains an unknown source name"
          },
          "500": {
            "description": "Internal server error"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "SumResponse": {
        "type": "object",
        "required": [
          "sum"
        ],
        "properties": {
          "sum": {
            "type": "string",
            "description": "Sum as a decimal string (exceeds 64-bit integer range)",
            "example": "78179288397447443426"
          }
        }
      },
      "GreekGod": {
        "type": "object",
        "required": [
          "id",
          "name"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64",
            "description": "ID of the Greek god",
            "example": 1
          },
          "name": {
            "type": "string",
            "description": "Name of the Greek god",
            "example": "Zeus"
          }
        }
      }
    }
  }
}
